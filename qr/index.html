<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR - Kitty Café</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main class="content" style="padding-top:56px; text-align:center">
      <section class="page-card">
        <h1>QR Kitty Café</h1>
        <p>Ce QR ouvre la version GitHub Pages du site.</p>
        <img
          src="https://api.qrserver.com/v1/create-qr-code/?size=640x640&data=https%3A%2F%2Fmikonzi33.github.io%2Fkitty-cafe%2F"
          alt="QR code Kitty Café GitHub Pages"
          style="width:min(100%,420px); border-radius:22px; background:white; padding:16px"
        />
        <p>
          <a class="button" href="https://mikonzi33.github.io/kitty-cafe/">Ouvrir le site</a>
        </p>
      </section>
    </main>
  </body>
